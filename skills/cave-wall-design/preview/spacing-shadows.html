<!DOCTYPE html>
<html data-theme="cueva"><head><meta charset="utf-8"/><title>Spacing & shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="../themes/cueva.css"/>
<link rel="stylesheet" href="../themes/luminoso.css"/>
<link rel="stylesheet" href="../themes/moderno.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--stone-1);color:var(--bone);}
  .wrap{width:700px;padding:24px 30px;display:flex;flex-direction:column;gap:14px;}
  .label{font-family:var(--font-stamp);font-size:12px;letter-spacing:.1em;color:var(--bone-dim);text-transform:uppercase;}
  .row{display:flex;gap:14px;align-items:flex-end;}
  .token{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-stamp);font-size:11px;color:var(--bone);text-transform:uppercase;letter-spacing:.06em;}
  .bar{background:var(--ochre-yellow);height:14px;}
  .shadow-demo{display:flex;gap:16px;}
  .card{width:140px;height:70px;background:#d9bf89;border:2px solid var(--charcoal);display:flex;align-items:center;justify-content:center;font-family:var(--font-stamp);font-size:10px;color:var(--charcoal);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:6px;}
  .c1{box-shadow:2px 2px 0 rgba(0,0,0,.35);}
  .c2{box-shadow:inset 0 0 24px rgba(90,50,10,.35), 0 6px 18px rgba(0,0,0,.5);}
  .c3{box-shadow:3px 3px 0 var(--ochre-red);}
</style></head>
<body>
<div style="position:fixed;top:10px;right:10px;z-index:9999;display:flex;gap:4px;"><button onclick="document.documentElement.setAttribute('data-theme','cueva')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#3b2a1b;color:#efe3c7;border:1px solid #8b2f1a;">cueva</button><button onclick="document.documentElement.setAttribute('data-theme','luminoso')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#e0c898;color:#1a120a;border:1px solid #b03820;">luminoso</button><button onclick="document.documentElement.setAttribute('data-theme','moderno')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#f4efe6;color:#18120a;border:1px solid #b89050;">moderno</button></div>
<div class="wrap">
  <div class="label">Spacing scale</div>
  <div class="row">
    <div class="token"><div class="bar" style="width:14px"></div>14</div>
    <div class="token"><div class="bar" style="width:28px"></div>28</div>
    <div class="token"><div class="bar" style="width:52px"></div>52</div>
    <div class="token"><div class="bar" style="width:100px"></div>100</div>
    <div class="token"><div class="bar" style="width:140px"></div>140</div>
  </div>
  <div class="label">Shadow system</div>
  <div class="shadow-demo">
    <div class="card c1">Hard offset</div>
    <div class="card c2">Inset + drop</div>
    <div class="card c3">Ochre shadow</div>
  </div>
</div>
</body></html>
