<!DOCTYPE html>
<html data-theme="cueva"><head><meta charset="utf-8"/><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="../themes/cueva.css"/>
<link rel="stylesheet" href="../themes/luminoso.css"/>
<link rel="stylesheet" href="../themes/moderno.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--stone-1);}
  .wrap{width:700px;padding:26px 30px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .meta{font-family:var(--font-stamp);font-size:12px;letter-spacing:.1em;color:var(--bone-dim);text-transform:uppercase;}
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-stamp);font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px;border:3px solid var(--charcoal);background:var(--ochre-yellow);color:var(--charcoal);cursor:pointer;filter:url(#rough);text-decoration:none;}
  .btn--red{background:var(--ochre-red);color:var(--bone);border-color:var(--ochre-deep);}
  .btn--ghost{background:transparent;color:var(--bone);border-color:var(--bone);}
  .btn--sm{padding:6px 14px;font-size:12px;}
</style></head>
<body>
<div style="position:fixed;top:10px;right:10px;z-index:9999;display:flex;gap:4px;"><button onclick="document.documentElement.setAttribute('data-theme','cueva')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#3b2a1b;color:#efe3c7;border:1px solid #8b2f1a;">cueva</button><button onclick="document.documentElement.setAttribute('data-theme','luminoso')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#e0c898;color:#1a120a;border:1px solid #b03820;">luminoso</button><button onclick="document.documentElement.setAttribute('data-theme','moderno')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#f4efe6;color:#18120a;border:1px solid #b89050;">moderno</button></div>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>
<div class="wrap">
  <div class="meta">Primary · Yellow ochre</div>
  <div class="row">
    <button class="btn">Paint the beast</button>
    <button class="btn btn--sm">Grunt yes</button>
  </div>
  <div class="meta">Strong · Red ochre</div>
  <div class="row">
    <button class="btn btn--red">Begin hunt</button>
    <button class="btn btn--red btn--sm">Tally III</button>
  </div>
  <div class="meta">Ghost · Bone outline</div>
  <div class="row">
    <button class="btn btn--ghost">Not now</button>
    <button class="btn btn--ghost btn--sm">Cancel</button>
  </div>
</div>
</body></html>
