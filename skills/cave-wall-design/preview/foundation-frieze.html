<!DOCTYPE html>
<html data-theme="cueva"><head><meta charset="utf-8"/><title>Frieze pattern</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="../themes/cueva.css"/>
<link rel="stylesheet" href="../themes/luminoso.css"/>
<link rel="stylesheet" href="../themes/moderno.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--stone-1);}
  .wrap{width:700px;padding:26px 30px;display:flex;flex-direction:column;gap:16px;}
  .label{font-family:var(--font-stamp);font-size:12px;letter-spacing:.1em;color:var(--bone-dim);text-transform:uppercase;}
  .frieze{display:flex;align-items:center;justify-content:space-around;gap:20px;color:var(--bone);padding:10px 0;border-top:2px solid var(--bone);border-bottom:2px solid var(--bone);}
</style></head>
<body>
<div style="position:fixed;top:10px;right:10px;z-index:9999;display:flex;gap:4px;"><button onclick="document.documentElement.setAttribute('data-theme','cueva')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#3b2a1b;color:#efe3c7;border:1px solid #8b2f1a;">cueva</button><button onclick="document.documentElement.setAttribute('data-theme','luminoso')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#e0c898;color:#1a120a;border:1px solid #b03820;">luminoso</button><button onclick="document.documentElement.setAttribute('data-theme','moderno')" style="font-family:monospace;font-size:10px;padding:3px 8px;cursor:pointer;background:#f4efe6;color:#18120a;border:1px solid #b89050;">moderno</button></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <symbol id="pg-bison" viewBox="0 0 200 120"><path d="M20,80 C30,50 55,40 80,42 C85,30 100,28 110,35 C125,30 145,35 160,50 C175,55 180,70 175,85 C170,95 150,95 145,88 L140,100 L135,88 L100,90 L95,100 L90,88 L60,90 L55,102 L50,88 C40,90 25,88 20,80 Z" fill="currentColor"/></symbol>
  <symbol id="pg-spiral" viewBox="0 0 100 100"><path d="M50,50 m0,0 a4,4 0 1,1 8,0 a8,8 0 1,1 -16,0 a14,14 0 1,1 28,0 a20,20 0 1,1 -40,0 a26,26 0 1,1 48,-6" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="pg-paw" viewBox="0 0 100 100"><ellipse cx="50" cy="65" rx="22" ry="18" fill="currentColor"/><ellipse cx="25" cy="40" rx="9" ry="11" fill="currentColor"/><ellipse cx="42" cy="22" rx="9" ry="11" fill="currentColor"/><ellipse cx="62" cy="22" rx="9" ry="11" fill="currentColor"/><ellipse cx="78" cy="40" rx="9" ry="11" fill="currentColor"/></symbol>
  <symbol id="pg-chev" viewBox="0 0 40 30"><path d="M5,25 L20,5 L35,25" stroke="currentColor" stroke-width="3" fill="none"/></symbol>
  <symbol id="pg-spear" viewBox="0 0 120 30"><path d="M2,15 L95,15 M85,5 L110,15 L85,25 M15,9 L15,21 M35,10 L35,20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
</defs></svg>
<div class="wrap">
  <div class="label">Frieze — mixed pictographs</div>
  <div class="frieze">
    <svg width="40" height="24"><use href="#pg-bison"/></svg>
    <svg width="26" height="26"><use href="#pg-spiral"/></svg>
    <svg width="26" height="26"><use href="#pg-paw"/></svg>
    <svg width="40" height="24"><use href="#pg-bison"/></svg>
    <svg width="26" height="26"><use href="#pg-spiral"/></svg>
    <svg width="26" height="26"><use href="#pg-paw"/></svg>
    <svg width="40" height="24"><use href="#pg-bison"/></svg>
    <svg width="26" height="26"><use href="#pg-spiral"/></svg>
  </div>
  <div class="label">Frieze — chevrons</div>
  <div class="frieze">
    <svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg><svg width="24" height="18"><use href="#pg-chev"/></svg>
  </div>
  <div class="label">Frieze — spears</div>
  <div class="frieze">
    <svg width="60" height="16"><use href="#pg-spear"/></svg><svg width="60" height="16" style="transform:scaleX(-1)"><use href="#pg-spear"/></svg><svg width="60" height="16"><use href="#pg-spear"/></svg><svg width="60" height="16" style="transform:scaleX(-1)"><use href="#pg-spear"/></svg>
  </div>
</div>
</body></html>
